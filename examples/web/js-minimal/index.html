<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <script type="module">
      import CreateShenaiSDK, { createPreloadDisplay } from "./shenai-sdk/index.mjs"
      const urlParams = new URLSearchParams(window.location.search)
      const API_KEY = urlParams.get("apiKey") || "YOUR_API_KEY"
      const USER_ID = ""
      const precisionMode = urlParams.get("precisionMode")
      const preset = urlParams.get("preset")
      CreateShenaiSDK({
        enablePreloadDisplay: true
      }).then(shenai => {
        shenai.initialize(
          API_KEY,
          USER_ID,
          {
            hideShenaiLogo: false,
            cameraMode: shenai.CameraMode.FACING_USER,
            measurementPreset: shenai.MeasurementPreset.FOURTY_FIVE_SECONDS_UNVALIDATED,
            eventCallback: event => {
              console.log("Shen.AI event:", event)
            },
            onCameraError: () => console.log("camera error")
          },
          result => {
            if (result === shenai.InitializationResult.OK) {
              console.log("Shen.AI initialized (license activated)")
              if (precisionMode === "relaxed") {
                shenai.setPrecisionMode(shenai.PrecisionMode.RELAXED)
              }
              if (preset === "45s") {
                shenai.setPreset(shenai.MeasurementPreset.FOURTY_FIVE_SECONDS_UNVALIDATED)
              }
              if (preset === "30s") {
                shenai.setPreset(shenai.MeasurementPreset.THIRTY_SECONDS_UNVALIDATED)
              }
              if (preset === "clinical") {
                shenai.setPreset(shenai.MeasurementPreset.CLINICAL_TRIAL)
              }
            } else {
              console.error("Shen.AI license activation error", result)
            }
          }
        )
        window.shenai = shenai // expose shenai for console & UI callbacks
      })

      function setFullViewportHeight() {
        const vh = window.innerHeight * 0.01
        document.documentElement.style.setProperty("--vh", `${vh}px`)
      }

      if (/Android/.test(navigator.userAgent) && /Chrome\/\d+/.test(navigator.userAgent)) {
        window.addEventListener("resize", setFullViewportHeight)
        document.addEventListener("DOMContentLoaded", setFullViewportHeight)
      }

      // ---- PDF helpers ----
      document.addEventListener("DOMContentLoaded", () => {
        const emailInput = document.getElementById("emailInput")
        const sendPdfBtn = document.getElementById("sendPdfBtn")
        const openPdfBtn = document.getElementById("openPdfBtn")

        sendPdfBtn?.addEventListener("click", () => {
          const email = emailInput.value.trim()
          if (!email) {
            alert("Please enter an email address first.")
            return
          }
          if (window.shenai?.sendMeasurementResultsPdfToEmail) {
            window.shenai.sendMeasurementResultsPdfToEmail(email, success =>
              console.log("PDF sent successfully:", success)
            )
            emailInput.value = ""
          } else {
            console.warn("Shen.AI SDK not ready yet.")
          }
        })

        openPdfBtn?.addEventListener("click", () => {
          if (window.shenai?.openMeasurementResultsPdfInBrowser) {
            window.shenai.openMeasurementResultsPdfInBrowser()
          } else {
            console.warn("Shen.AI SDK not ready yet.")
          }
        })
      })
    </script>

    <style>
      body {
        margin: 0;
      }
      .wrapper {
        position: relative; /* for absolutely‑positioned controls */
        width: 100vw;
        height: 100vh;
        height: calc(var(--vh, 1vh) * 100);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      @supports (-webkit-touch-callout: none) {
        .wrapper {
          height: -webkit-fill-available;
        }
      }

      #mxcanvas {
        aspect-ratio: 480/894;
        max-width: 100%;
        max-height: 100%;
      }
      @supports (-webkit-touch-callout: none) {
        #mxcanvas {
          max-height: -webkit-fill-available;
        }
      }
      @media (max-aspect-ratio: 480/894) {
        #mxcanvas {
          width: 100%;
          height: auto;
        }
      }
      @media (min-aspect-ratio: 480/894) {
        #mxcanvas {
          height: 100%;
          width: auto;
        }
      }

      /* ------------- Controls ------------- */
      .controls {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(4px);
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        max-width: 220px;
      }
      .controls input {
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      .controls button {
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
        border: none;
        border-radius: 4px;
        background: #0074d9;
        color: #fff;
        transition: background 0.2s ease;
      }
      .controls button:hover {
        background: #005fa3;
      }
      .controls hr {
        width: 100%;
        border: none;
        border-top: 1px solid #ddd;
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <canvas id="mxcanvas"></canvas>

      <!-- PDF / Email controls -->
      <!-- <div class="controls">
        <input type="email" id="emailInput" placeholder="Enter email" />
        <button id="sendPdfBtn">SEND PDF</button>
        <hr />
        <button id="openPdfBtn">OPEN PDF</button>
      </div> -->
    </div>
  </body>
</html>
